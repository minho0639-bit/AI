<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>팬레터포스트 | 편지 작성</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700&family=Cormorant+Garamond:wght@500;600&family=Nanum+Pen+Script&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="letter-compose.css" />
  </head>
  <body>
    <header class="compose-nav">
      <div class="brand">팬레터포스트</div>
      <div class="nav-actions">
        <button type="button" class="ghost tiny" id="backToSelect">대상 다시 선택</button>
        <button type="button" class="ghost tiny" id="backHome">홈으로</button>
      </div>
    </header>

    <main class="compose-main">
      <section class="target-summary">
        <p>보낼 대상</p>
        <h1 id="targetName">선택된 대상이 없습니다</h1>
        <p id="targetDetail" class="muted"></p>
      </section>

      <section class="stationery">
        <div class="section-head">
          <div>
            <p class="badge">STEP 01</p>
            <h2>편지지 스타일</h2>
            <p class="muted">분위기에 맞는 편지지를 선택하면 미리보기에서 바로 확인할 수 있어요.</p>
          </div>
        </div>
        <div class="stationery-grid" id="stationeryGrid"></div>
      </section>

      <section class="font-picker">
        <div class="section-head">
          <div>
            <p class="badge">STEP 02</p>
            <h2>폰트 선택</h2>
            <p class="muted">분위기를 살릴 수 있는 폰트를 고르면 손편지 감성이 살아납니다.</p>
          </div>
        </div>
        <div class="font-grid" id="fontGrid"></div>
      </section>

      <section class="editor">
        <div class="editor-layout">
          <div class="editor-form">
            <label>
              편지 제목
              <input type="text" id="letterTitle" placeholder="예) 생일을 축하해요" maxlength="80" />
            </label>
            <label>
              편지 내용
              <textarea
                id="letterBody"
                rows="8"
                maxlength="1500"
                placeholder="이곳에 마음을 담아 작성해 주세요. 1,500자까지 입력 가능합니다."
              ></textarea>
            </label>
            <div class="editor-meta">
              <span id="charCount">0 / 1500자</span>
            </div>
          </div>
          <div class="preview-panel">
            <p>실시간 미리보기</p>
            <div class="preview-canvas" id="previewCanvas">
              <h3 id="previewTitle">제목이 여기에 표시됩니다</h3>
              <p id="previewBody">편지 내용을 입력하면 여기에 미리보기가 나타납니다.</p>
            </div>
          </div>
        </div>
      </section>

      <section class="compose-actions">
        <button type="button" class="ghost" id="saveDraft">임시 저장</button>
        <button type="button" class="primary" id="toSummary">다음 단계</button>
      </section>
    </main>

    <script>
      const params = new URLSearchParams(window.location.search);
      const targetName = document.getElementById("targetName");
      const targetDetail = document.getElementById("targetDetail");
      const previewCanvas = document.getElementById("previewCanvas");
      const previewTitle = document.getElementById("previewTitle");
      const previewBody = document.getElementById("previewBody");
      const letterTitle = document.getElementById("letterTitle");
      const letterBody = document.getElementById("letterBody");
      const charCount = document.getElementById("charCount");
      const backToSelect = document.getElementById("backToSelect");
      const backHome = document.getElementById("backHome");
      const saveDraft = document.getElementById("saveDraft");
      const toSummary = document.getElementById("toSummary");

      function setTargetSummary() {
        const name = params.get("name");
        const categoryLabel = params.get("categoryLabel");
        const subcategoryLabel = params.get("subcategoryLabel");
        const agency = params.get("agency");
        const team = params.get("team");

        if (name) {
          targetName.textContent = name;
          targetDetail.textContent = [categoryLabel, subcategoryLabel, agency, team]
            .filter(Boolean)
            .join(" · ");
        } else {
          targetName.textContent = "선택된 대상이 없습니다";
          targetDetail.textContent = "대상을 먼저 선택해 주세요.";
        }
      }

      setTargetSummary();

      const stationeryOptions = [
        {
          id: "classic",
          name: "클래식 코튼",
          desc: "따뜻한 크림색 코튼 텍스처",
          className: "classic",
        },
        {
          id: "midnight",
          name: "미드나잇 블루",
          desc: "딥블루와 금박 라인",
          className: "midnight",
        },
        {
          id: "pastel",
          name: "파스텔 러브",
          desc: "파스텔 톤 그라디언트",
          className: "pastel",
        },
      ];

      const fontOptions = [
        { id: "pretendard", name: "Pretendard", className: "font-pretendard" },
        { id: "cormorant", name: "Cormorant", className: "font-cormorant" },
        { id: "nanum", name: "Nanum Pen", className: "font-nanum" },
      ];

      let selectedStationery = stationeryOptions[0].id;
      let selectedFont = fontOptions[0].id;

      function renderStationery() {
        const grid = document.getElementById("stationeryGrid");
        grid.innerHTML = "";
        stationeryOptions.forEach((option) => {
          const card = document.createElement("button");
          card.type = "button";
          card.className = `stationery-card ${option.className} ${
            option.id === selectedStationery ? "active" : ""
          }`;
          card.innerHTML = `
            <div class="stationery-preview"></div>
            <div>
              <strong>${option.name}</strong>
              <p>${option.desc}</p>
            </div>
          `;
          card.addEventListener("click", () => {
            selectedStationery = option.id;
            renderStationery();
            applyPreviewStyles();
          });
          grid.appendChild(card);
        });
      }

      function renderFonts() {
        const grid = document.getElementById("fontGrid");
        grid.innerHTML = "";
        fontOptions.forEach((option) => {
          const button = document.createElement("button");
          button.type = "button";
          button.className = `font-card ${option.className} ${
            option.id === selectedFont ? "active" : ""
          }`;
          button.textContent = option.name;
          button.addEventListener("click", () => {
            selectedFont = option.id;
            renderFonts();
            applyPreviewStyles();
          });
          grid.appendChild(button);
        });
      }

      function applyPreviewStyles() {
        previewCanvas.className = `preview-canvas stationery-${selectedStationery}`;
        previewCanvas.classList.add(selectedFont);
        previewTitle.className = "";
        previewBody.className = "";
        previewTitle.classList.add(`font-${selectedFont}`);
        previewBody.classList.add(`font-${selectedFont}`);
      }

      letterTitle.addEventListener("input", () => {
        previewTitle.textContent = letterTitle.value || "제목이 여기에 표시됩니다";
      });

      letterBody.addEventListener("input", () => {
        previewBody.textContent = letterBody.value || "편지 내용을 입력하면 여기에 미리보기가 나타납니다.";
        charCount.textContent = `${letterBody.value.length} / 1500자`;
      });

      backToSelect.addEventListener("click", () => {
        window.location.href = "/letter.html";
      });

      backHome.addEventListener("click", () => {
        window.location.href = "/";
      });

      saveDraft.addEventListener("click", () => {
        alert("임시 저장 기능은 곧 제공될 예정입니다.");
      });

      toSummary.addEventListener("click", () => {
        alert("다음 단계(검수/결제)는 곧 연결됩니다.");
      });

      renderStationery();
      renderFonts();
      applyPreviewStyles();
    </script>
  </body>
</html>
