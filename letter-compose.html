<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>팬레터포스트 | 편지 작성</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700&family=Cormorant+Garamond:wght@500;600&family=Nanum+Pen+Script&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="letter-compose.css" />
  </head>
  <body>
    <header class="compose-nav">
      <div class="brand">팬레터포스트</div>
      <div class="nav-actions">
        <button type="button" class="ghost tiny" id="backToSelect">대상 다시 선택</button>
        <button type="button" class="ghost tiny" id="backHome">홈으로</button>
      </div>
    </header>

    <main class="compose-main">
      <section class="target-summary">
        <p>보낼 대상</p>
        <h1 id="targetName">선택된 대상이 없습니다</h1>
        <p id="targetDetail" class="muted"></p>
      </section>

      <section class="stationery">
        <div class="section-head">
          <div>
            <p class="badge">STEP 01</p>
            <h2>편지지 선택</h2>
            <p class="muted">원하는 분위기의 편지지를 선택해 주세요.</p>
          </div>
        </div>
        <div class="stationery-grid" id="stationeryGrid"></div>
      </section>

      <section class="font-picker">
        <div class="section-head">
          <div>
            <p class="badge">STEP 02</p>
            <h2>폰트 선택</h2>
            <p class="muted">기본 또는 필기체 중 원하는 스타일을 고르세요.</p>
          </div>
        </div>
        <div class="font-grid" id="fontGrid"></div>
      </section>

      <section class="paper-section">
        <div class="section-head">
          <div>
            <p class="badge">STEP 03</p>
            <h2>편지 작성</h2>
            <p class="muted">기본 편지지 위에서 바로 제목과 내용을 작성해 주세요.</p>
          </div>
        </div>
        <div class="paper-wrapper">
          <div class="paper-toolbar">
            <span id="charCount">0 / 1500자</span>
          </div>
          <div class="letter-paper" id="letterPaper">
            <div
              id="paperTitle"
              class="paper-title"
              contenteditable="true"
              data-placeholder="제목을 입력하세요 (최대 80자)"
            ></div>
            <div
              id="paperBody"
              class="paper-body"
              contenteditable="true"
              data-placeholder="편지 내용을 입력하세요 (최대 1,500자)"
            ></div>
          </div>
        </div>
      </section>

      <section class="compose-actions">
        <button type="button" class="ghost" id="saveDraft">임시 저장</button>
        <button type="button" class="primary" id="toSummary">다음 단계</button>
      </section>
    </main>

    <script>
      const params = new URLSearchParams(window.location.search);
      const targetName = document.getElementById("targetName");
      const targetDetail = document.getElementById("targetDetail");
      const paperTitle = document.getElementById("paperTitle");
      const paperBody = document.getElementById("paperBody");
      const charCount = document.getElementById("charCount");
      const backToSelect = document.getElementById("backToSelect");
      const backHome = document.getElementById("backHome");
      const saveDraft = document.getElementById("saveDraft");
      const toSummary = document.getElementById("toSummary");

      function setTargetSummary() {
        const name = params.get("name");
        const categoryLabel = params.get("categoryLabel");
        const subcategoryLabel = params.get("subcategoryLabel");
        const agency = params.get("agency");
        const team = params.get("team");

        if (name) {
          targetName.textContent = name;
          targetDetail.textContent = [categoryLabel, subcategoryLabel, agency, team]
            .filter(Boolean)
            .join(" · ");
        } else {
          targetName.textContent = "선택된 대상이 없습니다";
          targetDetail.textContent = "대상을 먼저 선택해 주세요.";
        }
      }

      setTargetSummary();

      const MAX_TITLE = 80;
      const MAX_BODY = 1500;
      let lastBodyText = "";
      let lastTitleText = "";
      let selectedStationery = "default";
      let selectedFont = "default";

      const stationeryOptions = [
        {
          id: "default",
          name: "기본 편지지",
          desc: "흰색 배경 + 라인",
          previewClass: "preview-default",
        },
        {
          id: "christmas",
          name: "크리스마스 편지지",
          desc: "포근한 레드 & 장식",
          previewClass: "preview-christmas",
        },
      ];

      const fontOptions = [
        { id: "default", name: "기본 폰트", className: "font-default" },
        { id: "handwriting", name: "필기체", className: "font-handwriting" },
      ];

      function renderStationeryOptions() {
        const grid = document.getElementById("stationeryGrid");
        grid.innerHTML = "";
        stationeryOptions.forEach((option) => {
          const card = document.createElement("button");
          card.type = "button";
          card.className = `stationery-card ${option.previewClass} ${
            option.id === selectedStationery ? "active" : ""
          }`;
          card.innerHTML = `
            <div class="stationery-preview"></div>
            <div>
              <strong>${option.name}</strong>
              <p>${option.desc}</p>
            </div>
          `;
          card.addEventListener("click", () => {
            selectedStationery = option.id;
            renderStationeryOptions();
            applyPaperStyles();
          });
          grid.appendChild(card);
        });
      }

      function renderFontOptions() {
        const grid = document.getElementById("fontGrid");
        grid.innerHTML = "";
        fontOptions.forEach((option) => {
          const button = document.createElement("button");
          button.type = "button";
          button.className = `font-card ${option.className} ${
            option.id === selectedFont ? "active" : ""
          }`;
          button.textContent = option.name;
          button.addEventListener("click", () => {
            selectedFont = option.id;
            renderFontOptions();
            applyPaperStyles();
          });
          grid.appendChild(button);
        });
      }

      function getPlainText(element) {
        return element.innerText.replace(/\r?\n/g, "\n").trimEnd();
      }

      function updateCharCount() {
        const text = getPlainText(paperBody);
        charCount.textContent = `${text.length} / ${MAX_BODY}자`;
      }

      paperTitle.addEventListener("input", () => {
        let text = getPlainText(paperTitle);
        if (text.length > MAX_TITLE) {
          paperTitle.innerText = lastTitleText;
          placeCursorEnd(paperTitle);
        } else {
          lastTitleText = text;
        }
      });

      paperBody.addEventListener("input", () => {
        let text = getPlainText(paperBody);
        if (text.length > MAX_BODY) {
          paperBody.innerText = lastBodyText;
          placeCursorEnd(paperBody);
        } else {
          lastBodyText = text;
          updateCharCount();
        }
      });

      function placeCursorEnd(el) {
        const range = document.createRange();
        range.selectNodeContents(el);
        range.collapse(false);
        const sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(range);
      }

      backToSelect.addEventListener("click", () => {
        const category = params.get("category");
        const categoryLabel = params.get("categoryLabel") || "";
        if (category) {
          const targetParams = new URLSearchParams({
            category,
            categoryLabel,
          });
          window.location.href = `/letter-target.html?${targetParams.toString()}`;
        } else {
          window.location.href = "/letter.html";
        }
      });

      backHome.addEventListener("click", () => {
        window.location.href = "/";
      });

      saveDraft.addEventListener("click", () => {
        alert("임시 저장 기능은 곧 제공될 예정입니다.");
      });

      toSummary.addEventListener("click", () => {
        alert("다음 단계(검수/결제)는 곧 연결됩니다.");
      });

      function applyPaperStyles() {
        const wrapper = document.getElementById("letterPaper");
        wrapper.className = `letter-paper paper-${selectedStationery} font-${selectedFont}`;
        paperTitle.className = `paper-title font-${selectedFont}`;
        paperBody.className = `paper-body font-${selectedFont}`;
        paperBody.dataset.placeholder =
          selectedFont === "handwriting"
            ? "따뜻한 손글씨 느낌으로 마음을 적어 보세요."
            : "편지 내용을 입력하세요 (최대 1,500자)";
      }

      renderStationeryOptions();
      renderFontOptions();
      applyPaperStyles();
      updateCharCount();
    </script>
  </body>
</html>
