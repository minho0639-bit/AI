<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>팬레터포스트 | 편지 작성</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700&family=Cormorant+Garamond:wght@500;600&family=Nanum+Pen+Script&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="letter-compose.css" />
  </head>
  <body>
      <header class="compose-nav">
        <div class="brand">팬레터포스트</div>
        <div class="nav-actions">
          <button type="button" class="ghost tiny" id="backToSelect">대상 다시 선택</button>
          <button type="button" class="ghost tiny" id="backHome">홈으로</button>
        </div>
      </header>

      <main class="compose-main">
        <section class="compose-controls" aria-label="서식 설정">
          <div class="control-group">
            <p class="group-label">폰트</p>
            <div class="chip-group" id="fontChips"></div>
          </div>
          <div class="control-group">
            <p class="group-label">폰트 색상</p>
            <div class="color-palette" id="colorPalette"></div>
          </div>
          <div class="control-group">
            <p class="group-label">이모티콘</p>
            <div class="emoji-toolbar" id="emojiToolbar">
              <button
                type="button"
                class="icon-button"
                id="emojiToggle"
                aria-expanded="false"
                aria-controls="emojiPopover"
                title="이모티콘 추가"
              >
                😊
              </button>
              <div class="emoji-popover" id="emojiPopover" hidden></div>
            </div>
          </div>
        </section>

        <section class="compose-editor">
          <div class="write-panel">
            <div class="letter-paper" id="letterPaper">
              <div
                id="paperBody"
                class="paper-body font-default"
                contenteditable="true"
                data-placeholder="편지 내용을 입력하세요 (최대 1,500자)"
              ></div>
            </div>
            <div class="paper-footer">
              <span class="meta-label" id="stationeryLabel">기본 편지지</span>
              <span class="meta-count" id="charCount">0 / 1500자</span>
            </div>
          </div>
          <div class="write-panel secondary" id="secondPagePanel" hidden>
            <div class="letter-paper" id="letterPaper2">
              <div
                id="paperBody2"
                class="paper-body font-default"
                contenteditable="true"
                data-placeholder="두 번째 편지 내용을 이어서 입력하세요"
              ></div>
            </div>
            <div class="paper-footer">
              <span class="meta-label" id="stationeryLabel2">기본 편지지</span>
              <span class="meta-count" id="charCount2">0 / 1500자</span>
            </div>
          </div>
        </section>

        <section class="compose-actions">
          <button type="button" class="ghost" id="saveDraft">임시 저장</button>
          <button type="button" class="primary" id="toSummary">다음 단계</button>
        </section>
      </main>

      <script>
        const params = new URLSearchParams(window.location.search);
        const paperBody = document.getElementById("paperBody");
        const letterPaper = document.getElementById("letterPaper");
        const charCount = document.getElementById("charCount");
        const secondPagePanel = document.getElementById("secondPagePanel");
        const letterPaper2 = document.getElementById("letterPaper2");
        const paperBody2 = document.getElementById("paperBody2");
        const charCount2 = document.getElementById("charCount2");
        const secondPageFooter = secondPagePanel?.querySelector(".paper-footer");
        const backToSelect = document.getElementById("backToSelect");
        const backHome = document.getElementById("backHome");
        const saveDraft = document.getElementById("saveDraft");
        const toSummary = document.getElementById("toSummary");
        const stationeryLabel = document.getElementById("stationeryLabel");
        const fontChips = document.getElementById("fontChips");
        const colorPalette = document.getElementById("colorPalette");
        const emojiToolbar = document.getElementById("emojiToolbar");
        const emojiToggle = document.getElementById("emojiToggle");
        const emojiPopover = document.getElementById("emojiPopover");

        const MAX_BODY_PAGE = 850;
        const MAX_BODY_TOTAL = 1600;

        const stationeryThemes = {
          basic: {
            label: "기본 편지지",
            className: "paper-photo",
            image: "assets/stationery/기본편지지(실제).JPG",
          },
          bear: {
            label: "파란 곰돌이 편지지",
            className: "paper-photo",
            image: "assets/stationery/파란배경곰돌이(실제).JPG",
          },
        };

        const fontOptions = [
          { id: "default", label: "Pretendard", className: "font-default" },
          { id: "serif", label: "Cormorant", className: "font-serif" },
          { id: "handwriting", label: "Nanum Pen", className: "font-handwriting" },
        ];

        const colorOptions = [
          { id: "ink", label: "잉크 블랙", value: "#1b1c1f" },
          { id: "navy", label: "네이비", value: "#1f3a93" },
          { id: "rose", label: "로즈", value: "#d94b8c" },
          { id: "forest", label: "포레스트", value: "#1f7a54" },
          { id: "sunset", label: "선셋", value: "#ff7a45" },
          { id: "cloud", label: "크림 화이트", value: "#f9f6ef" },
        ];
        const emojiOptions = ["😊", "😍", "🥰", "✨", "🌸", "🎉", "💌", "⭐", "🐻"];

        let lastBodyText = "";
        let lastBodyText2 = "";
        let selectedStationery = params.get("stationery") || "basic";
        if (!stationeryThemes[selectedStationery]) selectedStationery = "basic";
        let selectedFont = "default";
        let selectedColorId = colorOptions[0].id;
        const FIXED_FONT_SIZE = 17;

        function renderFontOptions() {
          fontChips.innerHTML = "";
          fontOptions.forEach((option) => {
            const button = document.createElement("button");
            button.type = "button";
            button.className = `chip-option ${option.className} ${
              option.id === selectedFont ? "active" : ""
            }`;
            button.textContent = option.label;
            button.addEventListener("click", () => {
              selectedFont = option.id;
              renderFontOptions();
              applyTypography();
            });
            fontChips.appendChild(button);
          });
        }

        function renderColorPalette() {
          colorPalette.innerHTML = "";
          colorOptions.forEach((option) => {
            const swatch = document.createElement("button");
            swatch.type = "button";
            swatch.className = `color-swatch ${option.id === selectedColorId ? "active" : ""}`;
            swatch.style.setProperty("--swatch-color", option.value);
            swatch.setAttribute("aria-label", option.label);
            swatch.innerHTML = "<span></span>";
              swatch.addEventListener("click", () => {
                selectedColorId = option.id;
                applyColorToSelection(option.value);
                renderColorPalette();
              });
            colorPalette.appendChild(swatch);
          });
        }
          
          function applyColorToSelection(color) {
            paperBody.focus();
            document.execCommand("styleWithCSS", false, true);
            document.execCommand("foreColor", false, color);
          }

        function applyStationeryStyles() {
          const theme = stationeryThemes[selectedStationery] || stationeryThemes.basic;
          const panels = [
            { paper: letterPaper, label: stationeryLabel },
            { paper: letterPaper2, label: stationeryLabel2 },
          ];
          panels.forEach(({ paper, label }, index) => {
            paper.className = `letter-paper ${theme.className || ""}`.trim();
            if (theme.image) {
              const imageUrl = encodeURI(theme.image);
              paper.classList.add("paper-photo");
              paper.style.backgroundImage = `url("${imageUrl}")`;
            } else {
              paper.style.backgroundImage = "";
            }
            label.textContent = index === 0 ? theme.label : `${theme.label} · ${index + 1}`;
          });
        }

        function applyTypography() {
          paperBody.className = `paper-body font-${selectedFont}`;
          paperBody2.className = `paper-body font-${selectedFont}`;
          paperBody.style.fontSize = `${FIXED_FONT_SIZE}px`;
          paperBody2.style.fontSize = `${FIXED_FONT_SIZE}px`;
          paperBody.dataset.placeholder =
            selectedFont === "handwriting"
              ? "따뜻한 손글씨 느낌으로 마음을 적어 보세요."
              : "편지 내용을 입력하세요 (최대 1,500자)";
          paperBody2.dataset.placeholder = "두 번째 편지 내용을 이어서 입력하세요";
        }

        function getPlainText(element) {
          return element.innerText.replace(/\r?\n/g, "\n").trimEnd();
        }

        function updateCharCount() {
          const text1 = getPlainText(paperBody);
          charCount.textContent = `${text1.length} / ${MAX_BODY_PAGE}자`;
          const text2 = getPlainText(paperBody2);
          charCount2.textContent = `${text2.length} / ${MAX_BODY_PAGE}자`;
        }

        function ensureSecondPageVisible() {
          if (!secondPagePanel.hidden) return;
          secondPagePanel.hidden = false;
          secondPagePanel.classList.add("visible");
        }

        function hideSecondPageIfEmpty() {
          if (getPlainText(paperBody2).length === 0) {
            secondPagePanel.hidden = true;
            secondPagePanel.classList.remove("visible");
          }
        }

        paperBody.addEventListener("input", () => {
          let text = getPlainText(paperBody);
          if (text.length > MAX_BODY_PAGE) {
            const overflow = text.slice(MAX_BODY_PAGE);
            paperBody.innerText = text.slice(0, MAX_BODY_PAGE);
            placeCursorEnd(paperBody);
            ensureSecondPageVisible();
            const existing = getPlainText(paperBody2);
            paperBody2.innerText = overflow + existing;
            placeCursorEnd(paperBody2);
          } else {
            lastBodyText = text;
          }
          updateCharCount();
        });

        paperBody2.addEventListener("input", () => {
          let text = getPlainText(paperBody2);
          const total = getPlainText(paperBody).length + text.length;
          if (text.length > MAX_BODY_PAGE || total > MAX_BODY_TOTAL) {
            paperBody2.innerText = lastBodyText2;
            placeCursorEnd(paperBody2);
          } else {
            lastBodyText2 = text;
          }
          hideSecondPageIfEmpty();
          updateCharCount();
        });

        function placeCursorEnd(el) {
          const range = document.createRange();
          range.selectNodeContents(el);
          range.collapse(false);
          const sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(range);
        }

        function insertEmoji(emoji) {
          paperBody.focus();
          document.execCommand("insertText", false, emoji);
          updateCharCount();
        }

        function renderEmojiOptions() {
          emojiPopover.innerHTML = "";
          emojiOptions.forEach((emoji) => {
            const btn = document.createElement("button");
            btn.type = "button";
            btn.className = "emoji-option";
            btn.textContent = emoji;
            btn.addEventListener("click", () => {
              insertEmoji(emoji);
              toggleEmojiPopover(false);
            });
            emojiPopover.appendChild(btn);
          });
        }

        function toggleEmojiPopover(forceState) {
          const isOpen = forceState !== undefined ? forceState : emojiPopover.hasAttribute("hidden");
          if (isOpen) {
            emojiPopover.removeAttribute("hidden");
            emojiPopover.classList.add("open");
            emojiToggle.setAttribute("aria-expanded", "true");
          } else {
            emojiPopover.setAttribute("hidden", "");
            emojiPopover.classList.remove("open");
            emojiToggle.setAttribute("aria-expanded", "false");
          }
        }

        emojiToggle.addEventListener("click", (event) => {
          event.stopPropagation();
          const shouldOpen = emojiPopover.hasAttribute("hidden");
          toggleEmojiPopover(shouldOpen);
        });

        document.addEventListener("click", (event) => {
          if (!emojiToolbar.contains(event.target)) {
            toggleEmojiPopover(false);
          }
        });

        backToSelect.addEventListener("click", () => {
          const category = params.get("category");
          const categoryLabel = params.get("categoryLabel") || "";
          if (category) {
            const targetParams = new URLSearchParams({
              category,
              categoryLabel,
            });
            window.location.href = `/letter-target.html?${targetParams.toString()}`;
          } else {
            window.location.href = "/letter.html";
          }
        });

        backHome.addEventListener("click", () => {
          window.location.href = "/";
        });

        saveDraft.addEventListener("click", () => {
          alert("임시 저장 기능은 곧 제공될 예정입니다.");
        });

        toSummary.addEventListener("click", () => {
          alert("다음 단계(검수/결제)는 곧 연결됩니다.");
        });

        renderFontOptions();
        renderColorPalette();
        renderEmojiOptions();
        applyStationeryStyles();
        applyTypography();
        updateCharCount();
      </script>
  </body>
</html>
