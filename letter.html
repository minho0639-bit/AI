<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>팬레터포스트 | 카테고리 선택</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="letter.css" />
    <script src="js/api-config.js"></script>
  </head>
  <body>
    <header class="top-nav">
      <div class="brand" onclick="window.location.href='/'">
        <img src="assets/logo.JPG" alt="레터비" class="logo-img" />
        <span class="logo-text" style="display: none;">레터비</span>
      </div>
      <div class="user-controls">
        <button class="quiet tiny user-nickname-button" type="button">
          <span class="user-nickname">Guest</span>
        </button>
        <button id="logoutBtn" class="ghost tiny" type="button">로그아웃</button>
      </div>
    </header>

    <main class="write-main">
      <section class="intro">
        <h1>소속사를 선택 해 주세요</h1>
        <p>소속사를 선택하시면 해당 소속사의 아이돌 및 가수를 찾을 수 있습니다.</p>
        <div class="search-box">
          <input type="text" id="artistSearch" placeholder="이름이나 팀을 검색해 주세요" />
          <button type="button" id="searchBtn" class="primary">검색</button>
        </div>
      </section>

      <section class="agency-section" id="agencySection">
        <p class="section-title">편지를 보내고 싶은 스타의 소속사와 그룹을 선택 해 주세요</p>
        <div class="agency-grid" id="agencyGrid">
          <p class="muted">인기 소속사를 불러오는 중...</p>
        </div>
      </section>

      <section class="category-grid" style="display: none;">
        <article class="category-card" data-category="entertainment">
          <div class="badge">Entertainment</div>
          <h2>엔터테인먼트</h2>
          <div class="category-media entertainment small"></div>
        </article>
        <article class="category-card" data-category="sports">
          <div class="badge">Sports</div>
          <h2>스포츠</h2>
          <div class="category-media sports small"></div>
        </article>
      </section>
    </main>

    <script>
      const categoryCards = document.querySelectorAll(".category-card");
      const artistSearch = document.getElementById("artistSearch");
      const searchBtn = document.getElementById("searchBtn");
      const agencyGrid = document.getElementById("agencyGrid");
      let selectedAgencyId = null;

      // 인기 소속사 목록 로드 (모든 대분류)
      async function loadPopularAgencies() {
        try {
          let agencies;
          if (window.apiConfig && window.apiConfig.json) {
            agencies = await window.apiConfig.json("/api/agencies?popularOnly=true");
          } else {
            const response = await fetch("/api/agencies?popularOnly=true");
            if (!response.ok) throw new Error("인기 소속사 목록을 불러오지 못했습니다.");
            agencies = await response.json();
          }
          renderAgencies(agencies, true);
        } catch (error) {
          console.error("Failed to load popular agencies:", error);
          agencyGrid.innerHTML = '<p class="muted">인기 소속사 목록을 불러오지 못했습니다.</p>';
        }
      }

      // 소속사 목록 로드 (대분류별로 필터링)
      async function loadAgencies(categoryKey) {
        try {
          // 대분류 ID 가져오기
          const categoryMap = {
            entertainment: "엔터테인먼트",
            sports: "스포츠",
          };
          const categoryName = categoryMap[categoryKey];
          if (!categoryName) {
            agencyGrid.innerHTML = '<p class="muted">대분류를 먼저 선택해 주세요.</p>';
            return;
          }
          
          // 카테고리 목록 가져오기
          let categoriesData;
          if (window.apiConfig && window.apiConfig.json) {
            categoriesData = await window.apiConfig.json("/api/recipients/categories");
          } else {
            const categoriesResponse = await fetch("/api/recipients/categories");
            if (!categoriesResponse.ok) throw new Error("카테고리 목록을 불러오지 못했습니다.");
            categoriesData = await categoriesResponse.json();
          }
          const { categories } = categoriesData;
          const category = categories.find(c => c.name === categoryName);
          
          if (!category) {
            agencyGrid.innerHTML = '<p class="muted">해당 대분류의 소속사가 없습니다.</p>';
            return;
          }
          
          let agencies;
          if (window.apiConfig && window.apiConfig.json) {
            agencies = await window.apiConfig.json(`/api/agencies?categoryId=${category.id}`);
          } else {
            const response = await fetch(`/api/agencies?categoryId=${category.id}`);
            if (!response.ok) throw new Error("소속사 목록을 불러오지 못했습니다.");
            agencies = await response.json();
          }
          renderAgencies(agencies, false);
        } catch (error) {
          console.error("Failed to load agencies:", error);
          agencyGrid.innerHTML = '<p class="muted">소속사 목록을 불러오지 못했습니다.</p>';
        }
      }

      function renderAgencies(agencies, isPopularOnly = false) {
        if (agencies.length === 0) {
          if (isPopularOnly) {
            agencyGrid.innerHTML = '<p class="muted">등록된 인기 소속사가 없습니다.</p>';
          } else {
            agencyGrid.innerHTML = '<p class="muted">등록된 소속사가 없습니다.</p>';
          }
          return;
        }

        agencyGrid.innerHTML = agencies.map((agency) => `
          <article class="agency-card" data-agency-id="${agency.id}">
            ${agency.image_url ? `<img src="${agency.image_url}" alt="${agency.name}" class="agency-image" />` : '<div class="agency-placeholder">🏢</div>'}
            <h3>${agency.name}</h3>
          </article>
        `).join('');

        // 소속사 선택 이벤트
        document.querySelectorAll(".agency-card").forEach((card) => {
          card.addEventListener("click", () => {
            // 기존 선택 해제
            document.querySelectorAll(".agency-card").forEach(c => c.classList.remove("active"));
            // 새 선택
            card.classList.add("active");
            selectedAgencyId = card.dataset.agencyId;
            
            // 소속사 선택 후 letter-target.html로 이동 (엔터테인먼트로 고정)
            const categoryKey = "entertainment";
            const label = categories[categoryKey];
            const params = new URLSearchParams({
              category: categoryKey,
              categoryLabel: label,
              agencyId: selectedAgencyId,
            });
            window.location.href = `/letter-target.html?${params.toString()}`;
          });
        });
        
      }

      const categories = {
        entertainment: "엔터테인먼트",
        sports: "스포츠",
      };

      categoryCards.forEach((card) => {
        card.addEventListener("click", async () => {
          const key = card.dataset.category;
          const label = categories[key];
          
          // 엔터테인먼트 선택 시 소속사 선택 화면으로 이동
          if (key === "entertainment") {
            // 대분류 선택 시 해당 대분류의 소속사 로드 및 표시
            document.getElementById("agencySection").style.display = "block";
            await loadAgencies(key);
            // 소속사 선택 대기 (소속사 선택 후 letter-target.html로 이동)
            // 소속사 선택 이벤트는 renderAgencies에서 처리됨
          } else {
            // 다른 대분류는 기존처럼 letter-target.html로 바로 이동
            const params = new URLSearchParams({
              category: key,
              categoryLabel: label,
            });
            window.location.href = `/letter-target.html?${params.toString()}`;
          }
        });
      });

      function handleSearch() {
        const keyword = artistSearch.value.trim();
        if (!keyword) {
          alert("검색어를 입력해 주세요.");
          return;
        }
        alert(`'${keyword}'에 대한 검색 결과는 곧 제공됩니다.`);
      }

      searchBtn.addEventListener("click", handleSearch);
      artistSearch.addEventListener("keypress", (event) => {
        if (event.key === "Enter") {
          event.preventDefault();
          handleSearch();
        }
      });

      // 페이지 로드 시 인기 소속사 목록 로드
      loadPopularAgencies();

      // URL 파라미터에서 선택된 소속사 확인
      const urlParams = new URLSearchParams(window.location.search);
      const agencyIdFromUrl = urlParams.get("agencyId");
      if (agencyIdFromUrl) {
        selectedAgencyId = agencyIdFromUrl;
      }

      // 로그인 상태 확인 및 사용자 정보 표시
      // DOM이 로드된 후에 요소를 찾기 위해 함수로 감싸기
      function getNicknameEl() {
        return document.querySelector(".user-nickname");
      }
      
      const nicknameBtn = document.querySelector(".user-nickname-button");
      const logoutBtn = document.getElementById("logoutBtn");

      function applySession(user) {
        console.log('applySession 호출됨, 사용자 정보:', user);
        document.body.classList.add("logged-in");
        const nicknameEl = getNicknameEl();
        if (nicknameEl) {
          const displayName = user?.name || user?.email || "팬";
          console.log('닉네임 업데이트:', displayName);
          nicknameEl.textContent = displayName;
        } else {
          console.warn('nicknameEl 요소를 찾을 수 없습니다. DOM이 아직 로드되지 않았을 수 있습니다.');
          // DOM이 로드될 때까지 기다렸다가 다시 시도
          setTimeout(() => {
            const nicknameEl = getNicknameEl();
            if (nicknameEl && user) {
              const displayName = user?.name || user?.email || "팬";
              console.log('닉네임 업데이트 (재시도):', displayName);
              nicknameEl.textContent = displayName;
            }
          }, 100);
        }
      }

      function clearSessionState() {
        document.body.classList.remove("logged-in");
        const nicknameEl = getNicknameEl();
        if (nicknameEl) nicknameEl.textContent = "Guest";
      }

      async function fetchSession() {
        console.log('=== fetchSession 시작 ===');
        const nicknameEl = getNicknameEl();
        console.log('nicknameEl:', nicknameEl ? '있음' : '없음');
        console.log('apiConfig:', typeof window.apiConfig, window.apiConfig?.baseUrl);
        
        try {
          // 먼저 localStorage에서 세션 정보 확인 (WebView 쿠키 문제 대응)
          try {
            const storedSession = localStorage.getItem('userSession');
            console.log('localStorage에서 세션 확인:', storedSession ? '있음' : '없음');
            if (storedSession) {
              const sessionData = JSON.parse(storedSession);
              const sessionAge = Date.now() - sessionData.timestamp;
              console.log('세션 나이:', Math.round(sessionAge / 1000 / 60), '분');
              // 24시간 이내의 세션만 유효
              if (sessionAge < 24 * 60 * 60 * 1000 && sessionData.user) {
                console.log('localStorage에서 세션 정보 복원:', sessionData.user);
                applySession(sessionData.user);
                // 백그라운드에서 서버 세션 확인
                checkServerSession();
                return;
              } else {
                console.log('세션이 만료되었습니다. 제거합니다.');
                // 만료된 세션 제거
                localStorage.removeItem('userSession');
              }
            }
          } catch (e) {
            console.warn('localStorage 읽기 실패:', e);
          }
          
          console.log('서버에서 세션 확인 시도...');
          let data;
          if (window.apiConfig && window.apiConfig.json) {
            console.log('apiConfig.json 사용하여 /api/me 호출');
            data = await window.apiConfig.json("/api/me", { credentials: 'include' });
          } else {
            console.log('일반 fetch 사용하여 /api/me 호출');
            const res = await fetch("/api/me", { credentials: 'include' });
            if (!res.ok) throw new Error('요청 실패');
            data = await res.json();
          }
          
          console.log('서버 세션 응답:', data);
          if (data.loggedIn && data.user) {
            console.log('로그인 상태 확인됨, 사용자 정보:', data.user);
            // 세션 정보를 localStorage에 저장
            try {
              localStorage.setItem('userSession', JSON.stringify({
                user: data.user,
                timestamp: Date.now()
              }));
              console.log('세션 정보를 localStorage에 저장했습니다.');
            } catch (e) {
              console.warn('localStorage 저장 실패:', e);
            }
            applySession(data.user);
          } else {
            console.log('로그인 상태 아님 또는 사용자 정보 없음');
            // localStorage에서도 제거
            try {
              localStorage.removeItem('userSession');
            } catch (e) {
              console.warn('localStorage 제거 실패:', e);
            }
            clearSessionState();
          }
        } catch (error) {
          console.error("세션 정보를 가져오지 못했습니다.", error);
          console.error("오류 상세:", error.message, error.stack);
          clearSessionState();
        }
      }
      
      // 백그라운드에서 서버 세션 확인 (localStorage 세션 사용 시)
      async function checkServerSession() {
        try {
          if (window.apiConfig && window.apiConfig.json) {
            const data = await window.apiConfig.json("/api/me", { credentials: 'include' });
            if (data.loggedIn && data.user) {
              // 서버 세션이 유효하면 localStorage 업데이트
              localStorage.setItem('userSession', JSON.stringify({
                user: data.user,
                timestamp: Date.now()
              }));
            } else {
              // 서버 세션이 없으면 localStorage 제거
              localStorage.removeItem('userSession');
              clearSessionState();
            }
          }
        } catch (error) {
          console.warn('서버 세션 확인 실패 (localStorage 세션 계속 사용):', error);
        }
      }

      if (logoutBtn) {
        logoutBtn.addEventListener("click", async () => {
          try {
            if (window.apiConfig && window.apiConfig.fetch) {
              await window.apiConfig.fetch("/api/logout", { 
                method: "POST",
                credentials: 'include'
              });
            } else {
              await fetch("/api/logout", { 
                method: "POST",
                credentials: 'include'
              });
            }
          } catch (error) {
            console.error("로그아웃 실패", error);
          } finally {
            // localStorage에서도 세션 제거
            try {
              localStorage.removeItem('userSession');
            } catch (e) {
              console.warn('localStorage 제거 실패:', e);
            }
            window.location.href = "/";
          }
        });
      }

      if (nicknameBtn) {
        nicknameBtn.addEventListener("click", () => {
          if (document.body.classList.contains("logged-in")) {
            window.location.href = "/profile.html";
          } else {
            window.location.href = "/";
          }
        });
      }

      // DOM이 로드된 후 세션 확인
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', fetchSession);
      } else {
        // DOM이 이미 로드된 경우 즉시 실행
        fetchSession();
      }
    </script>
  </body>
</html>
