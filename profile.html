<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>팬레터포스트 | 내 정보</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="profile.css" />
  </head>
  <body>
    <header class="profile-nav">
      <div class="brand" role="img" aria-label="Fanletter Post">Fanletter Post</div>
      <nav>
        <button type="button" class="ghost tiny" id="goHomeBtn">홈으로</button>
        <button type="button" class="ghost tiny" id="logoutBtn">로그아웃</button>
      </nav>
    </header>

    <main class="profile-main" aria-live="polite">
      <section class="profile-card" id="profileCard">
        <div class="profile-card__header">
          <div>
            <p class="badge">My Account</p>
            <h1>내 정보</h1>
          </div>
          <button type="button" class="ghost tiny" id="refreshProfile">새로고침</button>
        </div>
        <div class="profile-content" id="profileContent">
          <p class="muted">회원 정보를 불러오는 중입니다...</p>
        </div>
        <div class="profile-actions">
          <button type="button" class="primary" id="writeLetterBtn">편지 쓰러 가기</button>
        </div>
      </section>

      <section class="coupon-section" id="couponSection" hidden>
        <div class="coupon-section__header">
          <h2>내 쿠폰</h2>
          <p class="muted small">가입 시 제공되는 첫 결제 무료 쿠폰</p>
        </div>
        <div class="coupon-status" id="couponStatusCard">
          <div>
            <strong id="couponTitle">WELCOME-FREE</strong>
            <p class="muted small" id="couponDescription">기본 요금 2,000원 할인</p>
          </div>
          <span class="coupon-badge" id="couponBadge">사용 가능</span>
        </div>
        <p class="muted small" id="couponNotice"></p>
      </section>

      <section class="empty-section" id="emptyState" hidden>
        <p>로그인 정보를 확인할 수 없습니다.</p>
        <button type="button" class="primary" id="backHomeBtn">홈으로 이동</button>
      </section>
    </main>

    <script>
      const profileContent = document.getElementById("profileContent");
      const couponSection = document.getElementById("couponSection");
      const couponStatusCard = document.getElementById("couponStatusCard");
      const couponBadge = document.getElementById("couponBadge");
      const couponNotice = document.getElementById("couponNotice");
      const refreshProfileBtn = document.getElementById("refreshProfile");
      const logoutBtn = document.getElementById("logoutBtn");
      const goHomeBtn = document.getElementById("goHomeBtn");
      const backHomeBtn = document.getElementById("backHomeBtn");
      const writeLetterBtn = document.getElementById("writeLetterBtn");
      const emptyState = document.getElementById("emptyState");

      const WELCOME_COUPON_KEY = "fanletterWelcomeCoupon";

      async function fetchProfile() {
        try {
          profileContent.innerHTML = '<p class="muted">회원 정보를 불러오는 중입니다...</p>';
          const res = await fetch("/api/me");
          if (!res.ok) {
            throw new Error("회원 정보를 불러올 수 없습니다.");
          }
          const data = await res.json();
          if (!data.loggedIn) {
            handleLogoutState();
            return;
          }
          renderProfile(data.user);
        } catch (error) {
          profileContent.innerHTML = `<p class="error">${error.message}</p>`;
        }
      }

      function renderProfile(user) {
        emptyState.hidden = true;
        const rows = [
          { label: "이름", value: user.name || "이름 정보 없음" },
          { label: "이메일", value: user.email },
          { label: "회원 유형", value: user.isAdmin ? "관리자" : "일반 회원" },
          { label: "회원 번호", value: user.id },
        ];
        profileContent.innerHTML = `
          <dl class="profile-info">
            ${rows
              .map(
                (row) => `
              <div class="profile-info__row">
                <dt>${row.label}</dt>
                <dd>${row.value}</dd>
              </div>`
              )
              .join("")}
          </dl>
        `;
        renderCouponSection();
      }

      function renderCouponSection() {
        const coupon = loadCoupon();
        if (!coupon) {
          couponSection.hidden = true;
          return;
        }
        couponSection.hidden = false;
        couponStatusCard.classList.toggle("coupon-status--used", !!coupon.used);
        couponBadge.textContent = coupon.used ? "사용 완료" : "사용 가능";
        couponNotice.textContent = coupon.used
          ? `쿠폰이 ${new Date(coupon.usedAt).toLocaleDateString("ko-KR")}에 사용되었습니다.`
          : "결제 단계에서 '쿠폰 적용'을 누르면 자동으로 무료 처리됩니다.";
      }

      function loadCoupon() {
        try {
          const raw = localStorage.getItem(WELCOME_COUPON_KEY);
          return raw ? JSON.parse(raw) : null;
        } catch (error) {
          console.warn("쿠폰 정보를 읽지 못했습니다.", error);
          return null;
        }
      }

      function handleLogoutState() {
        emptyState.hidden = false;
        profileContent.innerHTML = "";
      }

      async function handleLogout() {
        try {
          await fetch("/api/logout", { method: "POST" });
        } catch (error) {
          console.warn("로그아웃 실패", error);
        } finally {
          window.location.href = "/";
        }
      }

      refreshProfileBtn?.addEventListener("click", fetchProfile);
      logoutBtn?.addEventListener("click", handleLogout);
      goHomeBtn?.addEventListener("click", () => (window.location.href = "/"));
      backHomeBtn?.addEventListener("click", () => (window.location.href = "/"));
      writeLetterBtn?.addEventListener("click", () => (window.location.href = "/letter.html"));

      fetchProfile();
    </script>
  </body>
</html>
