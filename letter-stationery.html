<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>팬레터포스트 | 편지지 선택</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="letter-stationery.css" />
  </head>
  <body>
    <header class="top-nav">
      <div class="brand" onclick="window.location.href='/'">
        <img src="assets/logo.JPG" alt="레터비" class="logo-img" />
        <span class="logo-text" style="display: none;">레터비</span>
      </div>
      <div class="user-controls">
        <button class="quiet tiny user-nickname-button" type="button">
          <span class="user-nickname">Guest</span>
        </button>
        <button id="logoutBtn" class="ghost tiny" type="button">로그아웃</button>
        <button type="button" class="ghost tiny" id="backToTarget">대상 다시 선택</button>
        <button type="button" class="ghost tiny" id="backHome">홈으로</button>
      </div>
    </header>

    <main class="stationery-main">
      <section class="target-summary">
        <p>보낼 대상</p>
        <h1 id="targetName">선택된 대상이 없습니다</h1>
        <p id="targetDetail" class="muted">대상을 먼저 선택해 주세요.</p>
      </section>

      <section class="stationery-section">
        <div class="section-head">
          <p class="badge">STEP 01</p>
          <h2>편지지 선택</h2>
          <p class="muted">원하는 분위기를 골라 편지 작성 페이지에 적용해 주세요.</p>
        </div>
        <div class="stationery-grid" id="stationeryGrid"></div>
      </section>

      <section class="stationery-actions">
        <button type="button" class="ghost" id="backToTargetBottom">대상 다시 선택</button>
        <button type="button" class="primary" id="goToCompose" disabled>편지 작성으로 이동</button>
      </section>
    </main>

    <script>
      const params = new URLSearchParams(window.location.search);
      const targetName = document.getElementById("targetName");
      const targetDetail = document.getElementById("targetDetail");
      const stationeryGrid = document.getElementById("stationeryGrid");
      const goToCompose = document.getElementById("goToCompose");
      const backToTargetButtons = [document.getElementById("backToTarget"), document.getElementById("backToTargetBottom")];
      const backHome = document.getElementById("backHome");

      const FALLBACK_STATIONERY = [
        {
          id: "fallback-basic",
          name: "기본 편지지",
          description: "가장 깔끔하게 연출되는 기본 디자인",
          previewImageUrl: "assets/stationery/basic.jpg",
        },
      ];

      let stationeryOptions = [];
      let selectedStationery = params.get("stationery") || null;

      function setTargetSummary() {
        const name = params.get("name");
        const categoryLabel = params.get("categoryLabel");
        const subcategoryLabel = params.get("subcategoryLabel");
        const agency = params.get("agency");
        const team = params.get("team");

        if (name) {
          targetName.textContent = name;
          targetDetail.textContent = [categoryLabel, subcategoryLabel, agency, team]
            .filter(Boolean)
            .join(" · ");
        }
      }

      async function loadStationeryOptions() {
        try {
          const response = await fetch("/api/stationery");
          if (!response.ok) {
            throw new Error("failed");
          }
          const data = await response.json();
          stationeryOptions = Array.isArray(data) && data.length > 0 ? data : FALLBACK_STATIONERY;
        } catch (error) {
          stationeryOptions = FALLBACK_STATIONERY;
        }

        if (
          selectedStationery &&
          !stationeryOptions.find((opt) => String(opt.id) === String(selectedStationery))
        ) {
          selectedStationery = null;
        }

        renderStationeryOptions();
      }

      function renderStationeryOptions() {
        stationeryGrid.innerHTML = "";
        stationeryOptions.forEach((option) => {
          const optionId = String(option.id);
          const card = document.createElement("button");
          card.type = "button";
          card.className = `stationery-card ${optionId === String(selectedStationery) ? "active" : ""}`;
          card.innerHTML = `
            <div class="stationery-preview">
              <img src="${option.previewImageUrl || "assets/stationery/basic.jpg"}" alt="${option.name} 미리보기" />
            </div>
            <div>
              <strong>${option.name}</strong>
              <p>${option.description || ""}</p>
            </div>
          `;
          card.addEventListener("click", () => {
            selectedStationery = optionId;
            goToCompose.disabled = false;
            renderStationeryOptions();
          });
          stationeryGrid.appendChild(card);
        });
        goToCompose.disabled = !selectedStationery;
      }

      function goToLetterCompose() {
        if (!selectedStationery) return;
        const composeParams = new URLSearchParams(params);
        composeParams.set("stationery", selectedStationery);
        window.location.href = `/letter-compose.html?${composeParams.toString()}`;
      }

      backToTargetButtons.forEach((btn) =>
        btn.addEventListener("click", () => {
          const category = params.get("category");
          const categoryLabel = params.get("categoryLabel");
          if (!category) {
            window.location.href = "/letter.html";
            return;
          }
          const targetParams = new URLSearchParams({
            category,
            categoryLabel: categoryLabel || "",
          });
          window.location.href = `/letter-target.html?${targetParams.toString()}`;
        })
      );

      backHome.addEventListener("click", () => {
        window.location.href = "/";
      });

      goToCompose.addEventListener("click", goToLetterCompose);

      setTargetSummary();
      loadStationeryOptions();

      // 로그인 상태 확인 및 사용자 정보 표시
      const nicknameEl = document.querySelector(".user-nickname");
      const nicknameBtn = document.querySelector(".user-nickname-button");
      const logoutBtn = document.getElementById("logoutBtn");

      function applySession(user) {
        document.body.classList.add("logged-in");
        if (nicknameEl) nicknameEl.textContent = user?.name || user?.email || "팬";
      }

      function clearSessionState() {
        document.body.classList.remove("logged-in");
        if (nicknameEl) nicknameEl.textContent = "Guest";
      }

      async function fetchSession() {
        try {
          const res = await fetch("/api/me");
          const data = await res.json();
          if (data.loggedIn) {
            applySession(data.user);
          } else {
            clearSessionState();
          }
        } catch (error) {
          console.error("세션 정보를 가져오지 못했습니다.", error);
        }
      }

      if (logoutBtn) {
        logoutBtn.addEventListener("click", async () => {
          try {
            await fetch("/api/logout", { method: "POST" });
          } catch (error) {
            console.error("로그아웃 실패", error);
          } finally {
            window.location.href = "/";
          }
        });
      }

      if (nicknameBtn) {
        nicknameBtn.addEventListener("click", () => {
          if (document.body.classList.contains("logged-in")) {
            window.location.href = "/profile.html";
          } else {
            window.location.href = "/";
          }
        });
      }

      fetchSession();
    </script>
  </body>
</html>
