<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>팬레터포스트 | 대상 세부 선택</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="letter.css" />
  </head>
  <body>
    <header class="write-nav">
      <div class="brand">팬레터포스트</div>
      <button type="button" id="backToCategory" class="ghost tiny">대분류 다시 선택</button>
    </header>

    <main class="write-main">
      <section class="intro">
        <h1 id="pageTitle">세부 카테고리를 선택해 주세요</h1>
        <p id="pageDesc" class="muted"></p>
      </section>

      <section class="details visible" id="detailsSection">
        <p class="section-title">소속사, 팀, 이름을 선택하세요</p>
        <div class="agency-cards-container" id="agencyCardsContainer" style="display: none; margin-bottom: 24px;">
          <p class="section-title" style="margin-bottom: 16px;">소속사를 선택하세요</p>
          <div class="recipient-cards-grid" id="agencyCardsGrid"></div>
        </div>
        <div class="group-cards-container" id="groupCardsContainer" style="display: none; margin-bottom: 24px;">
          <p class="section-title" style="margin-bottom: 16px;">팀 / 그룹을 선택하세요</p>
          <div class="recipient-cards-grid" id="groupCardsGrid"></div>
        </div>
        <div class="recipient-cards-container" id="recipientCardsContainer" style="display: none; margin-top: 24px;">
          <p class="section-title" style="margin-bottom: 16px;">수령인을 선택하세요</p>
          <div class="recipient-cards-grid" id="recipientCardsGrid"></div>
        </div>
      </section>

      <section class="summary">
        <div>
          <p>선택한 대상</p>
          <h3 id="selectionPreview">아직 선택되지 않았습니다.</h3>
        </div>
        <button type="button" id="nextStep" class="primary" disabled>편지지 선택으로 이동</button>
      </section>
    </main>

    <script>
      const CATEGORY_PRESETS = {
        entertainment: { label: "엔터테인먼트" },
        sports: { label: "스포츠" },
      };

      const SUBCATEGORY_PRESETS = {
        아이돌: {
          icon: "🎤",
          accent: "#ff4d8d",
          background: "linear-gradient(135deg, #fff5f9, #ffe3ef)",
          iconBg: "rgba(255, 77, 141, 0.18)",
          shadow: "rgba(255, 77, 141, 0.25)",
        },
        가수: {
          icon: "🎧",
          accent: "#7b5cff",
          background: "linear-gradient(135deg, #f3f0ff, #e3dbff)",
          iconBg: "rgba(123, 92, 255, 0.2)",
          shadow: "rgba(123, 92, 255, 0.2)",
        },
        배우: {
          icon: "🎬",
          accent: "#ff9f43",
          background: "linear-gradient(135deg, #fff5eb, #ffe2c8)",
          iconBg: "rgba(255, 159, 67, 0.22)",
          shadow: "rgba(255, 159, 67, 0.22)",
        },
        모델: {
          icon: "👗",
          accent: "#00c6ae",
          background: "linear-gradient(135deg, #e8fffb, #d3fff4)",
          iconBg: "rgba(0, 198, 174, 0.18)",
          shadow: "rgba(0, 198, 174, 0.25)",
        },
        축구: {
          icon: "⚽",
          accent: "#00b894",
          background: "linear-gradient(135deg, #ecfff9, #d3ffee)",
          iconBg: "rgba(0, 184, 148, 0.2)",
          shadow: "rgba(0, 184, 148, 0.2)",
        },
        야구: {
          icon: "⚾",
          accent: "#ff6b6b",
          background: "linear-gradient(135deg, #fff0f0, #ffdada)",
          iconBg: "rgba(255, 107, 107, 0.2)",
          shadow: "rgba(255, 107, 107, 0.2)",
        },
        e스포츠: {
          icon: "🎮",
          accent: "#00a8ff",
          background: "linear-gradient(135deg, #eef6ff, #d8ecff)",
          iconBg: "rgba(0, 168, 255, 0.2)",
          shadow: "rgba(0, 168, 255, 0.2)",
        },
      };

      const FALLBACK_STYLE = {
        icon: "✨",
        accent: "#2563eb",
        background: "linear-gradient(135deg, #eef2ff, #e0e7ff)",
        iconBg: "rgba(37, 99, 235, 0.12)",
        shadow: "rgba(37, 99, 235, 0.18)",
      };

      const params = new URLSearchParams(window.location.search);
      const categoryKey = params.get("category");
      const categoryPreset = CATEGORY_PRESETS[categoryKey];
      const categoryLabelFromParam = params.get("categoryLabel");
      const selectedAgencyId = params.get("agencyId") ? Number(params.get("agencyId")) : null;

      const pageTitle = document.getElementById("pageTitle");
      const pageDesc = document.getElementById("pageDesc");
      const backToCategory = document.getElementById("backToCategory");

      const detailsSection = document.getElementById("detailsSection");
      const selectionPreview = document.getElementById("selectionPreview");
      const nextButton = document.getElementById("nextStep");

      if (!categoryPreset) {
        window.location.replace("/letter.html");
      }

      backToCategory.addEventListener("click", () => {
        window.location.href = "/letter.html";
      });

      const state = {
        taxonomy: { categories: [], subcategories: [] },
        selectedCategory: null,
        recipients: [],
        selectedAgency: null,
        selectedGroup: null,
        selectedRecipient: null,
      };

      document.addEventListener("DOMContentLoaded", init);

      async function init() {
        try {
          await loadTaxonomy();
          resolveCategory();
          loadRecipientsForCategory();
        } catch (error) {
          alert("대상 정보를 불러오지 못했습니다. 다시 시도해 주세요.");
          window.location.replace("/letter.html");
        }
      }

      async function loadTaxonomy() {
        const response = await fetch("/api/recipients/categories");
        if (!response.ok) {
          throw new Error("taxonomy fetch failed");
        }
        state.taxonomy = await response.json();
      }

      function resolveCategory() {
        const categoryFromDb = state.taxonomy.categories.find(
          (cat) => cat.name === (categoryLabelFromParam || categoryPreset.label)
        );
        if (!categoryFromDb) {
          throw new Error("category not found");
        }
        state.selectedCategory = categoryFromDb;
        pageTitle.textContent = `${categoryFromDb.name} 대상 선택`;
        pageDesc.textContent = `${categoryFromDb.name} 분야의 소속사와 팀을 지정해 주세요.`;
      }

      async function loadRecipientsForCategory() {
        selectionPreview.textContent = "수령인 목록을 불러오는 중입니다...";
        document.getElementById("agencyCardsContainer").style.display = "none";
        document.getElementById("groupCardsContainer").style.display = "none";
        document.getElementById("recipientCardsContainer").style.display = "none";
        try {
          let url = `/api/recipients/by-category/${state.selectedCategory.id}`;
          if (selectedAgencyId) {
            url += `?agencyId=${selectedAgencyId}`;
          }
          const response = await fetch(url);
          if (!response.ok) {
            throw new Error("recipients fetch failed");
          }
          state.recipients = await response.json();
          populateAgencySelect();
        } catch (error) {
          selectionPreview.textContent = "수령인 목록을 불러오지 못했습니다.";
          document.getElementById("agencyCardsContainer").style.display = "none";
          document.getElementById("groupCardsContainer").style.display = "none";
          document.getElementById("recipientCardsContainer").style.display = "none";
        }
      }

      function populateAgencySelect() {
        const agencyMap = new Map();
        state.recipients.forEach((recipient) => {
          const agencyName = recipient.agency?.trim() || "소속사 미지정";
          if (!agencyMap.has(agencyName)) {
            agencyMap.set(agencyName, {
              name: agencyName,
              id: recipient.agency_id || null,
              image_url: recipient.agency_image_url || null,
            });
          } else {
            // 이미지가 없는 경우에만 업데이트 (null이 아닌 값이 있으면 유지)
            const existing = agencyMap.get(agencyName);
            if (!existing.image_url && recipient.agency_image_url) {
              existing.image_url = recipient.agency_image_url;
            }
            if (!existing.id && recipient.agency_id) {
              existing.id = recipient.agency_id;
            }
          }
        });

        const agencies = Array.from(agencyMap.values()).sort((a, b) => a.name.localeCompare(b.name, "ko"));

        if (agencies.length === 0) {
          document.getElementById("agencyCardsContainer").style.display = "none";
          document.getElementById("groupCardsContainer").style.display = "none";
          document.getElementById("recipientCardsContainer").style.display = "none";
          selectionPreview.textContent = "등록된 수령인이 없습니다. 관리자에게 문의해 주세요.";
          return;
        }

        const agencyCardsContainer = document.getElementById("agencyCardsContainer");
        const agencyCardsGrid = document.getElementById("agencyCardsGrid");
        agencyCardsContainer.style.display = "block";
        agencyCardsGrid.innerHTML = "";

        agencies.forEach((agency) => {
          const card = document.createElement("button");
          card.type = "button";
          card.className = "recipient-card";
          card.dataset.agencyName = agency.name;
          card.innerHTML = `
            <div class="recipient-card-image">
              ${agency.image_url ? `<img src="/${agency.image_url}" alt="${agency.name}" />` : '<div class="recipient-card-placeholder">🏢</div>'}
            </div>
            <div class="recipient-card-name">${agency.name}</div>
          `;
          card.addEventListener("click", () => {
            document.querySelectorAll("#agencyCardsGrid .recipient-card").forEach(c => c.classList.remove("active"));
            card.classList.add("active");
            state.selectedAgency = agency.name;
            populateGroupSelect();
          });
          agencyCardsGrid.appendChild(card);
        });

        // 선택된 소속사가 하나만 있거나, URL 파라미터에서 agencyId가 있으면 자동 선택
        if (agencies.length === 1 || (selectedAgencyId && agencies.length > 0)) {
          const agencyToSelect = selectedAgencyId 
            ? agencies.find(a => a.id === selectedAgencyId) || agencies[0]
            : agencies[0];
          
          if (agencyToSelect) {
            state.selectedAgency = agencyToSelect.name;
            // 해당 소속사 카드 찾아서 클릭 시뮬레이션
            setTimeout(() => {
              const matchingCard = Array.from(document.querySelectorAll("#agencyCardsGrid .recipient-card"))
                .find(card => card.dataset.agencyName === agencyToSelect.name);
              if (matchingCard) {
                matchingCard.classList.add("active");
                populateGroupSelect();
              }
            }, 100);
            return;
          }
        }
        
        selectionPreview.textContent = "소속사를 선택해 주세요.";
      }

      function populateGroupSelect() {
        if (!state.selectedAgency) return;
        const groupMap = new Map();
        state.recipients
          .filter((recipient) => normalizeAgency(recipient.agency) === state.selectedAgency)
          .forEach((recipient) => {
            const groupName = recipient.group_name?.trim() || "그룹/팀 미지정";
            if (!groupMap.has(groupName)) {
              groupMap.set(groupName, {
                name: groupName,
                image_url: recipient.group_image_url || null,
              });
            } else {
              // 이미지가 없는 경우에만 업데이트 (null이 아닌 값이 있으면 유지)
              const existing = groupMap.get(groupName);
              if (!existing.image_url && recipient.group_image_url) {
                existing.image_url = recipient.group_image_url;
              }
            }
          });

        const groups = Array.from(groupMap.values()).sort((a, b) => a.name.localeCompare(b.name, "ko"));

        const groupCardsContainer = document.getElementById("groupCardsContainer");
        const groupCardsGrid = document.getElementById("groupCardsGrid");

        if (groups.length === 0) {
          groupCardsContainer.style.display = "none";
          state.selectedGroup = null;
          selectionPreview.textContent = "팀/그룹 정보가 없습니다. 이름을 바로 선택해 주세요.";
          populateNameSelect();
        } else {
          groupCardsContainer.style.display = "block";
          groupCardsGrid.innerHTML = "";

          groups.forEach((group) => {
            const card = document.createElement("button");
            card.type = "button";
            card.className = "recipient-card";
            card.dataset.groupName = group.name;
            card.innerHTML = `
              <div class="recipient-card-image">
                ${group.image_url ? `<img src="/${group.image_url}" alt="${group.name}" />` : '<div class="recipient-card-placeholder">👥</div>'}
              </div>
              <div class="recipient-card-name">${group.name}</div>
            `;
            card.addEventListener("click", () => {
              document.querySelectorAll("#groupCardsGrid .recipient-card").forEach(c => c.classList.remove("active"));
              card.classList.add("active");
              state.selectedGroup = group.name;
              populateNameSelect();
            });
            groupCardsGrid.appendChild(card);
          });

          selectionPreview.textContent = "팀/그룹을 선택해 주세요.";
        }
      }

      function populateNameSelect() {
        if (!state.selectedAgency) return;
        const filteredRecipients = state.recipients.filter((recipient) => {
          const sameAgency = normalizeAgency(recipient.agency) === state.selectedAgency;
          const groupName = recipient.group_name?.trim() ? recipient.group_name.trim() : "그룹/팀 미지정";
          if (!state.selectedGroup) {
            return sameAgency;
          }
          return sameAgency && groupName === state.selectedGroup;
        });

        const recipientCardsContainer = document.getElementById("recipientCardsContainer");
        const recipientCardsGrid = document.getElementById("recipientCardsGrid");
        
        if (filteredRecipients.length === 0) {
          recipientCardsContainer.style.display = "none";
          selectionPreview.textContent = "해당 조건의 수령인이 없습니다.";
          return;
        }
        
        recipientCardsContainer.style.display = "block";
        recipientCardsGrid.innerHTML = "";
        
        filteredRecipients.forEach((recipient) => {
          const card = document.createElement("button");
          card.type = "button";
          card.className = "recipient-card";
          card.dataset.recipientId = recipient.id;
          card.innerHTML = `
            <div class="recipient-card-image">
              ${recipient.image_url ? `<img src="/${recipient.image_url}" alt="${recipient.name}" />` : '<div class="recipient-card-placeholder">👤</div>'}
            </div>
            <div class="recipient-card-name">${recipient.name}</div>
          `;
          card.addEventListener("click", () => {
            document.querySelectorAll(".recipient-card").forEach(c => c.classList.remove("active"));
            card.classList.add("active");
            const recipientId = Number(card.dataset.recipientId);
            state.selectedRecipient = state.recipients.find((r) => r.id === recipientId) || null;
            updateSelectionPreview();
          });
          recipientCardsGrid.appendChild(card);
        });
      }

      function normalizeAgency(value) {
        return value?.trim() || "소속사 미지정";
      }



      function updateSelectionPreview() {
        if (!state.selectedRecipient) {
          selectionPreview.textContent = "아직 선택되지 않았습니다.";
          nextButton.disabled = true;
          return;
        }

        const agencyLabel = normalizeAgency(state.selectedRecipient.agency);
        const groupLabel = state.selectedRecipient.group_name?.trim() || "그룹/팀 미지정";
        selectionPreview.textContent = [
          state.selectedCategory.name,
          agencyLabel,
          groupLabel,
          state.selectedRecipient.name,
        ]
          .filter(Boolean)
          .join(" · ");
        nextButton.disabled = false;
      }

      function resetSelections(level) {
        if (level === "agency") {
          state.selectedGroup = null;
          state.selectedRecipient = null;
          document.getElementById("groupCardsContainer").style.display = "none";
          document.getElementById("recipientCardsContainer").style.display = "none";
        } else if (level === "team") {
          state.selectedRecipient = null;
          document.getElementById("recipientCardsContainer").style.display = "none";
        }
        selectionPreview.textContent = "아직 선택되지 않았습니다.";
        nextButton.disabled = true;
      }

      nextButton.addEventListener("click", () => {
        if (!state.selectedRecipient) return;
        const redirectParams = new URLSearchParams({
          category: categoryKey,
          categoryLabel: state.selectedCategory.name,
          agency: normalizeAgency(state.selectedRecipient.agency),
          team: state.selectedRecipient.group_name?.trim() || "",
          name: state.selectedRecipient.name,
          recipientId: state.selectedRecipient.id,
        });
        window.location.href = `/letter-stationery.html?${redirectParams.toString()}`;
      });
    </script>
  </body>
</html>
