<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>팬레터포스트 | 대상 세부 선택</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="letter.css" />
  </head>
  <body>
    <header class="write-nav">
      <div class="brand">팬레터포스트</div>
      <button type="button" id="backToCategory" class="ghost tiny">대분류 다시 선택</button>
    </header>

    <main class="write-main">
      <section class="intro">
        <h1 id="pageTitle">세부 카테고리를 선택해 주세요</h1>
        <p id="pageDesc" class="muted"></p>
      </section>

      <section class="subcategories visible" id="subcategorySection">
        <p class="section-title">중간 분류를 선택하세요</p>
        <div class="chip-list" id="subcategoryChips"></div>
      </section>

      <section class="details" id="detailsSection">
        <p class="section-title">소속사, 팀, 이름을 선택하세요</p>
        <div class="selection-grid">
          <label>
            소속사
            <select id="agencySelect" disabled>
              <option value="">먼저 중간 분류를 선택하세요</option>
            </select>
          </label>
          <label>
            팀 / 그룹
            <select id="teamSelect" disabled>
              <option value="">소속사를 선택하세요</option>
            </select>
          </label>
          <label>
            이름
            <select id="nameSelect" disabled>
              <option value="">팀을 선택하세요</option>
            </select>
          </label>
        </div>
      </section>

      <section class="summary">
        <div>
          <p>선택한 대상</p>
          <h3 id="selectionPreview">아직 선택되지 않았습니다.</h3>
        </div>
        <button type="button" id="nextStep" class="primary" disabled>편지지 선택으로 이동</button>
      </section>
    </main>

    <script>
      const params = new URLSearchParams(window.location.search);
      const categoryKey = params.get("category");
      const categoryLabelFromParam = params.get("categoryLabel");

      const pageTitle = document.getElementById("pageTitle");
      const pageDesc = document.getElementById("pageDesc");
      const backToCategory = document.getElementById("backToCategory");

      const subcategoryChips = document.getElementById("subcategoryChips");
      const detailsSection = document.getElementById("detailsSection");
      const agencySelect = document.getElementById("agencySelect");
      const teamSelect = document.getElementById("teamSelect");
      const nameSelect = document.getElementById("nameSelect");
      const selectionPreview = document.getElementById("selectionPreview");
      const nextButton = document.getElementById("nextStep");

      backToCategory.addEventListener("click", () => {
        window.location.href = "/letter.html";
      });

      if (!categoryKey) {
        window.location.replace("/letter.html");
      }

        const categoryData = {
          entertainment: {
            label: "엔터테인먼트",
            subcategories: {
              idol: {
                label: "아이돌",
                icon: "🎤",
                tagline: "퍼포먼스 중심 팬덤",
                accent: "#ff4d8d",
                background: "linear-gradient(135deg, #fff5f9, #ffe3ef)",
                iconBg: "rgba(255, 77, 141, 0.18)",
                shadow: "rgba(255, 77, 141, 0.25)",
                agencies: {
                  HYBE: {
                    teams: {
                      "뉴진스": ["민지", "하니", "다니엘", "해린", "혜인"],
                      "세븐틴": ["에스쿱스", "정한", "조슈아", "준", "호시"],
                    },
                  },
                  "SM엔터테인먼트": {
                    teams: {
                      "에스파": ["카리나", "윈터", "지젤", "닝닝"],
                      "NCT 127": ["태일", "쟈니", "태용", "유타", "재현"],
                    },
                  },
                },
              },
              singer: {
                label: "가수",
                icon: "🎧",
                tagline: "감성 보컬리스트",
                accent: "#7b5cff",
                background: "linear-gradient(135deg, #f3f0ff, #e3dbff)",
                iconBg: "rgba(123, 92, 255, 0.2)",
                shadow: "rgba(123, 92, 255, 0.2)",
                agencies: {
                  "안테나뮤직": { teams: { "솔로": ["이무진", "권진아"] } },
                  "어도어": { teams: { "솔로": ["백예린"] } },
                },
              },
              actor: {
                label: "배우",
                icon: "🎬",
                tagline: "스크린과 브라운관의 주역",
                accent: "#ff9f43",
                background: "linear-gradient(135deg, #fff5eb, #ffe2c8)",
                iconBg: "rgba(255, 159, 67, 0.22)",
                shadow: "rgba(255, 159, 67, 0.22)",
                agencies: {
                  "BH엔터테인먼트": { teams: { "배우": ["이병헌", "한지민", "박보영"] } },
                  "어썸이엔티": { teams: { "배우": ["박서준", "한지혜"] } },
                },
              },
              model: {
                label: "모델",
                icon: "👗",
                tagline: "런웨이 & 화보 아이콘",
                accent: "#00c6ae",
                background: "linear-gradient(135deg, #e8fffb, #d3fff4)",
                iconBg: "rgba(0, 198, 174, 0.18)",
                shadow: "rgba(0, 198, 174, 0.25)",
                agencies: {
                  Esteem: { teams: { "모델": ["한혜진", "장윤주"] } },
                  YGKPlus: { teams: { "모델": ["정호연", "이성경"] } },
                },
              },
            },
          },
          sports: {
            label: "스포츠",
            subcategories: {
              football: {
                label: "축구",
                icon: "⚽",
                tagline: "그라운드의 슈퍼스타",
                accent: "#00b894",
                background: "linear-gradient(135deg, #ecfff9, #d3ffee)",
                iconBg: "rgba(0, 184, 148, 0.2)",
                shadow: "rgba(0, 184, 148, 0.2)",
                agencies: {
                  "토트넘 홋스퍼": { teams: { "1군": ["손흥민", "해리 케인"] } },
                  "울버햄튼": { teams: { "1군": ["황희찬"] } },
                  "K리그": {
                    teams: {
                      "울산 현대": ["조현우", "이청용"],
                      "전북 현대": ["송범근", "백승호"],
                    },
                  },
                },
              },
              baseball: {
                label: "야구",
                icon: "⚾",
                tagline: "구장을 가르는 한 방",
                accent: "#ff6b6b",
                background: "linear-gradient(135deg, #fff0f0, #ffdada)",
                iconBg: "rgba(255, 107, 107, 0.2)",
                shadow: "rgba(255, 107, 107, 0.2)",
                agencies: {
                  "샌디에이고 파드리스": { teams: { "MLB": ["김하성"] } },
                  "KBO": {
                    teams: {
                      "LG 트윈스": ["김현수", "문보경"],
                      "SSG 랜더스": ["최정", "박성한"],
                    },
                  },
                },
              },
              esports: {
                label: "e스포츠",
                icon: "🎮",
                tagline: "디지털 아레나의 히어로",
                accent: "#00a8ff",
                background: "linear-gradient(135deg, #eef6ff, #d8ecff)",
                iconBg: "rgba(0, 168, 255, 0.2)",
                shadow: "rgba(0, 168, 255, 0.2)",
                agencies: {
                  "T1": { teams: { "LoL": ["Faker", "Zeus"] } },
                  "Gen.G": { teams: { "LoL": ["Chovy", "Peanut"] } },
                },
              },
            },
          },
        };

      const selectedCategoryData = categoryData[categoryKey];
      if (!selectedCategoryData) {
        window.location.replace("/letter.html");
      }

      pageTitle.textContent = `${selectedCategoryData.label} 대상 선택`;
      pageDesc.textContent = `${selectedCategoryData.label} 분야의 세부 카테고리를 선택한 뒤, 소속사와 팀을 지정해 주세요.`;

      let selectedSubcategory = null;
      let selectedAgency = null;
      let selectedTeam = null;
      let selectedName = null;

      function resetSelections(level) {
        if (level === "subcategory") {
          selectedAgency = null;
          selectedTeam = null;
          selectedName = null;
          agencySelect.innerHTML = '<option value="">소속사를 선택하세요</option>';
          agencySelect.disabled = true;
          teamSelect.innerHTML = '<option value="">팀/그룹을 선택하세요</option>';
          teamSelect.disabled = true;
          nameSelect.innerHTML = '<option value="">이름을 선택하세요</option>';
          nameSelect.disabled = true;
        } else if (level === "agency") {
          selectedTeam = null;
          selectedName = null;
          teamSelect.innerHTML = '<option value="">팀/그룹을 선택하세요</option>';
          teamSelect.disabled = true;
          nameSelect.innerHTML = '<option value="">이름을 선택하세요</option>';
          nameSelect.disabled = true;
        } else if (level === "team") {
          selectedName = null;
          nameSelect.innerHTML = '<option value="">이름을 선택하세요</option>';
          nameSelect.disabled = true;
        }
        updateSelectionPreview();
        nextButton.disabled = true;
      }

      function updateSelectionPreview() {
        if (selectedSubcategory && selectedAgency && selectedTeam && selectedName) {
          const subLabel = selectedCategoryData.subcategories[selectedSubcategory].label;
          selectionPreview.textContent = `${selectedCategoryData.label} · ${subLabel} · ${selectedAgency} · ${selectedTeam} · ${selectedName}`;
          nextButton.disabled = false;
        } else {
          selectionPreview.textContent = "아직 선택되지 않았습니다.";
        }
      }

      function setupSubcategories() {
        const subcategories = selectedCategoryData.subcategories;
        subcategoryChips.innerHTML = "";
        Object.entries(subcategories).forEach(([key, value]) => {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "chip";
          button.dataset.subcategory = key;
            const descMarkup = value.tagline ? `<span class="chip-desc">${value.tagline}</span>` : "";
            button.innerHTML = `
              <span class="chip-icon" aria-hidden="true">${value.icon || "✨"}</span>
              <span class="chip-details">
                <span class="chip-label">${value.label}</span>
                ${descMarkup}
              </span>
            `;
            button.style.setProperty("--chip-accent", value.accent || "var(--primary)");
            button.style.setProperty("--chip-bg", value.background || "#fff");
            button.style.setProperty("--chip-icon-bg", value.iconBg || "rgba(17, 17, 17, 0.08)");
            button.style.setProperty("--chip-shadow", value.shadow || "rgba(17, 17, 17, 0.05)");
          button.addEventListener("click", () => {
            document.querySelectorAll(".chip").forEach((chip) => chip.classList.remove("active"));
            button.classList.add("active");
            selectedSubcategory = key;
            resetSelections("subcategory");

            const agencies = subcategories[key].agencies;
            agencySelect.innerHTML = '<option value="">소속사를 선택하세요</option>';
            Object.keys(agencies).forEach((agency) => {
              const option = document.createElement("option");
              option.value = agency;
              option.textContent = agency;
              agencySelect.appendChild(option);
            });
            agencySelect.disabled = false;
            detailsSection.classList.add("visible");
          });
          subcategoryChips.appendChild(button);
        });
      }

      agencySelect.addEventListener("change", () => {
        selectedAgency = agencySelect.value || null;
        resetSelections("agency");
        if (!selectedAgency || !selectedSubcategory) return;

        const teams =
          selectedCategoryData.subcategories[selectedSubcategory].agencies[selectedAgency].teams;
        teamSelect.innerHTML = '<option value="">팀/그룹을 선택하세요</option>';
        Object.keys(teams).forEach((team) => {
          const option = document.createElement("option");
          option.value = team;
          option.textContent = team;
          teamSelect.appendChild(option);
        });
        teamSelect.disabled = false;
      });

      teamSelect.addEventListener("change", () => {
        selectedTeam = teamSelect.value || null;
        resetSelections("team");
        if (!selectedTeam || !selectedSubcategory || !selectedAgency) return;

        const names =
          selectedCategoryData.subcategories[selectedSubcategory].agencies[selectedAgency].teams[
            selectedTeam
          ];
        nameSelect.innerHTML = '<option value="">이름을 선택하세요</option>';
        names.forEach((name) => {
          const option = document.createElement("option");
          option.value = name;
          option.textContent = name;
          nameSelect.appendChild(option);
        });
        nameSelect.disabled = false;
      });

        nameSelect.addEventListener("change", () => {
          selectedName = nameSelect.value || null;
          updateSelectionPreview();
        });

        nextButton.addEventListener("click", () => {
          if (nextButton.disabled) return;
          const params = new URLSearchParams({
            category: categoryKey,
            categoryLabel: selectedCategoryData.label,
            subcategory: selectedSubcategory,
            subcategoryLabel: selectedCategoryData.subcategories[selectedSubcategory].label,
            agency: selectedAgency,
            team: selectedTeam,
            name: selectedName,
          });
          window.location.href = `/letter-stationery.html?${params.toString()}`;
        });

      setupSubcategories();
    </script>
  </body>
</html>
